<section id="features" class="py-5 bg-light">
    <div class="container text-center">
      <h2 class="section-title">مميزات VetSmart</h2>
      <p class="section-subtitle">خدمات ذكية ومخصصة لمجال الطب البيطري</p>
  
      <div class="row mt-5">
        <div class="col-md-4 mb-4" *ngFor="let feature of features">
          <div class="feature-card p-4 h-100">
            <div class="icon mb-3">
              <i [class]="feature.icon" style="font-size: 2.5rem; color: #007bff;"></i>
            </div>
            <h5>{{ feature.title }}</h5>
            <p class="text-muted">{{ feature.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>
