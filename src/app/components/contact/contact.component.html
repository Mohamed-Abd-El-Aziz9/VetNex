<div class="container" id="contact">
  <div class="text-center">
    <h2>تواصل معنا</h2>
    <p class="lead">نحب نسمع منك. ابعتلنا استفسارك أو تواصلك وسيتم الرد في أقرب وقت.</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-container">
        <form>
          <div class="mb-3">
            <label class="form-label">الاسم</label>
            <input type="text" class="form-control" placeholder="اسمك الكامل" />
          </div>
          <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" placeholder="example@mail.com" />
          </div>
          <div class="mb-3">
            <label class="form-label">الرسالة</label>
            <textarea class="form-control" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
          </div>
          <button type="submit">إرسال الرسالة</button>
        </form>

        <div class="contact-info mt-4">
          <p>📞 <span>0100-123-4567</span></p>
          <p>✉️ <span>contact@vetsmart.com</span></p>
          <p>📍 <span>القاهرة، مصر</span></p>
        </div>
      </div>
    </div>
  </div>
</div>
